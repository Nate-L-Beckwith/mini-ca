name: ci

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mini-ca

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Unit tests
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Shell scripts
        run: shellcheck docker/*.sh

      - name: Build image and smoke-test the CLI inside it
        run: |
          docker build -f docker/Dockerfile --build-arg VERSION=ci -t minica:ci .
          docker run --rm --entrypoint mini_ca.py minica:ci --version
          docker run --rm -e MINICA_DATA=/tmp/ca --entrypoint sh minica:ci -c '
            set -e
            mini_ca.py init --days 30
            mini_ca.py issue smoke.lan --san 10.0.0.1 --san "*.smoke.lan"
            mini_ca.py verify smoke.lan
            mini_ca.py renew smoke.lan
            mini_ca.py list
            mini_ca.py info'

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
